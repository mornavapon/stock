name: notify-movers

on:
  # ไม่ตั้งเวลาเองแล้ว: เวลา 08:00 / 12:50 / 18:30 สั่งจาก cron-job.org (เรียก workflow_dispatch)
  workflow_dispatch:
    inputs:
      mode:
        description: "ping = ทดสอบข้อความสั้น, am = สรุปสหรัฐ, noon = หุ้นไทยพักเที่ยง, pm = สรุปเอเชีย"
        type: choice
        options: [ping, am, noon, pm]
        default: ping
      force:
        description: "ข้ามการเช็กว่าข้อมูลเก่า (ใช้ทดสอบวันที่ตลาดปิด)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        if: ${{ inputs.mode != 'ping' }}
        run: python3 fetch_prices.py
      - name: Send notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ inputs.mode }}
          FORCE: ${{ inputs.force }}
        run: python3 notify.py
