name: notify-movers

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 เวลาไทย -> สรุปตลาดสหรัฐ
    - cron: "50 5 * * *"  # 12:50 เวลาไทย -> หุ้นไทยหลังปิดภาคเช้า
    - cron: "30 11 * * *" # 18:30 เวลาไทย -> สรุปตลาดเอเชียและหุ้นไทย
  workflow_dispatch:
    inputs:
      mode:
        description: "ping = ทดสอบข้อความสั้น, am = สรุปสหรัฐ, noon = หุ้นไทยพักเที่ยง, pm = สรุปเอเชีย"
        type: choice
        options: [ping, am, noon, pm]
        default: ping
      force:
        description: "ข้ามการเช็กว่าข้อมูลเก่า (ใช้ทดสอบวันที่ตลาดปิด)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        if: ${{ github.event_name == 'schedule' || inputs.mode != 'ping' }}
        run: python3 fetch_prices.py
      - name: Send notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 1 * * *' && 'am' || (github.event.schedule == '50 5 * * *' && 'noon' || 'pm')) || inputs.mode }}
          FORCE: ${{ inputs.force }}
        run: python3 notify.py
