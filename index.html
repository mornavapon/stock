<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Portfolio</title>
<style>
:root{
  --bg:#2a2d2c; --row:#2a2d2c; --card:#343837; --card2:#3f4443;
  --bar:#1f6b43; --bar-dark:#185536; --bar-text:#ffffff; --bar-dim:#b7d9c5;
  --text:#eceff1; --muted:#9aa5a0; --line:#3d4140;
  --up:#5fd47c; --down:#ff7a6b; --accent:#7fe0a5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text)}
.sub{color:var(--muted)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;
  background:var(--bg)}

/* ---------- ส่วนที่ตรึง ---------- */
#bar{flex:none;display:flex;align-items:center;gap:2px;background:var(--bar);color:var(--bar-text);
  padding:calc(2px + env(safe-area-inset-top)) 6px 2px 10px;min-height:48px}
#bar h1{flex:1;min-width:0;margin:0;font-size:20px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--bar-text)}
.ib:active{background:rgba(255,255,255,.18)}
.ib svg{width:24px;height:24px;fill:currentColor}
.spin svg{animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tabs{flex:none;display:flex;background:var(--bar)}
#tabs button{flex:1;border:0;background:transparent;padding:9px 0;font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--bar-dim);border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#fff}
#status{flex:none;display:flex;align-items:center;gap:8px;justify-content:space-between;
  padding:0 14px;font-size:12px;color:var(--muted);background:#232625;height:32px}
#status .warn{color:#ffcf6b;background:none;border:0;padding:2px 0;text-decoration:underline;font-size:12px}
#colhead{flex:none;margin:8px 8px 0;padding:8px 10px;background:var(--card);border-radius:10px 10px 0 0;
  font-size:12px}
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 8px;background:var(--bg)}
#foot{flex:none;min-height:60px;margin:0 8px calc(8px + env(safe-area-inset-bottom));padding:11.1px 10px;background:var(--card);
  border-radius:0 0 10px 10px;font-size:13px}
.ib[hidden]{display:none}
#colhead[hidden],#foot[hidden],#tabs[hidden]{display:none}

/* ---------- ตาราง ---------- */
.grid{display:grid;grid-template-columns:27fr 28fr 19fr 26fr;column-gap:6px;align-items:start}
.grid .c{min-width:0}
.grid .r{text-align:right}
#colhead .c{display:flex;flex-direction:column;gap:1px;color:var(--text);cursor:pointer;line-height:1.25}
#colhead .c.r{align-items:flex-end}
#colhead b{font-weight:600}
#colhead small{color:var(--muted);font-size:11px}
#colhead .arrow{color:var(--accent);margin-left:3px;font-size:10px}
.row{padding:10.3px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;line-height:1.35}
.row:active{background:#323634}
.row .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:14.5px;line-height:1.15}
.row .num{white-space:nowrap}
/* ตัวเลขฝั่งขวา (มูลค่า / วันนี้ / กำไร) ใหญ่ขึ้นให้อ่านง่าย ความสูงแถวคงเดิม */
.row .c.r,#foot .c.r{line-height:1.2}
.row .c.r > div:first-child,#foot .c.r > div:first-child{font-size:17px}
.row .c.r > div:nth-child(2),#foot .c.r > div:nth-child(2){font-size:14.5px}
.row .fname{grid-column:1/-1;font-size:13px;line-height:1.15;color:#7d8883;margin-top:2.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .line3 .fn{color:#7d8883}
.row .line3.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .line3{grid-column:1/-1;font-size:14.5px;line-height:1.15;color:var(--muted);margin-top:2.5px}
.tag{font-size:10px;border:1px solid var(--muted);border-radius:4px;padding:0 3px;margin-left:4px;color:var(--muted)}
.nop{color:#ffcf6b}
.empty{padding:36px 16px;text-align:center;color:var(--muted);line-height:1.8;font-size:14px}
#foot .c.r div{white-space:nowrap}
#foot .lbl{font-weight:600}
#foot .c:first-child .sub{white-space:nowrap}
#foot .sub{font-size:12px}

/* ---------- Details ---------- */
.det{padding:6px 0 24px}
.pie{width:100%;max-width:600px;display:block;margin:0 auto;-webkit-user-select:none;user-select:none}
.pie path,.pie circle{cursor:pointer;transition:opacity .15s,transform .15s;transform-origin:50px 50px}
.pie .dim{opacity:.28}
.pie [data-pk]{cursor:pointer;transition:opacity .15s,transform .15s;transform-origin:50px 50px}
.pie path.sel{transform:scale(1.045)}
.pie path.sel{transform:scale(1.045)}
.pie text{font-family:inherit;pointer-events:none}
.hint2{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.legend{margin-top:10px}
.lg{display:grid;grid-template-columns:14px 1fr auto auto;gap:4px 10px;align-items:center;cursor:pointer;
  padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
.lg.on{background:var(--card)}
.lg i{width:12px;height:12px;border-radius:3px;display:block}
.lg .p{font-weight:600;min-width:56px;text-align:right}
.lg .v{color:var(--muted);font-size:12.5px;min-width:80px;text-align:right}

.pt{margin:18px 8px 2px;font-size:15px;font-weight:600}
.pt small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.pie2{margin-bottom:6px}
.sep{border:0;border-top:1px solid var(--line);margin:22px 8px 0}
/* ---------- Valuation ---------- */
.val{margin-top:22px}
.val h3{margin:0 8px 6px;font-size:14px;font-weight:600}
.vscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vt{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.vt th{color:var(--muted);font-weight:600;font-size:11px;text-align:right;padding:6px 6px;
  border-bottom:1px solid var(--line);vertical-align:bottom;line-height:1.3}
.vt td{text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
.vt th:first-child,.vt td:first-child{text-align:left;padding-left:8px}
.vt a{color:var(--accent);text-decoration:none;font-weight:600}
.vt .na{color:var(--muted)}
.vt th[data-vs]{cursor:pointer;user-select:none}
.vt th[data-vs]:active{color:var(--text)}
.vt th .ar{color:var(--accent);font-size:9px;margin-left:2px}
.vt th.on{color:var(--text)}
.vnote{font-size:11.5px;color:var(--muted);line-height:1.65;margin:10px 8px 0}

/* ---------- เมนู / dialog / toast ---------- */
#menu{position:fixed;right:8px;top:calc(54px + env(safe-area-inset-top));z-index:30;background:var(--card2);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.55);min-width:230px;padding:6px 0;overflow:hidden}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:13px 18px;font-size:15px}
#menu button:active{background:rgba(255,255,255,.08)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#menu .danger{color:var(--down)}
#scrim{position:fixed;inset:0;z-index:25;background:transparent}
#scrim[hidden]{display:none}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:0;
  max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.62)}
.dlg{padding:18px}
.dlg h2{margin:0 0 6px;font-size:18px}
.dlg label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.dlg input[type=text],.dlg input[type=number],.dlg select,.dlg textarea{width:100%;padding:11px;border-radius:10px;
  border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;font-family:inherit}
.dlg textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.dlg .chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;margin-top:14px}
.dlg .chk input{width:20px;height:20px}
.dlg .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.dlg .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg .acts button{flex:1 1 0;min-width:84px;padding:12px 8px;border:0;border-radius:12px;font-size:15px;
  font-weight:600;background:var(--card2)}
.dlg .acts .pri{background:var(--bar);color:#fff}
.dlg .acts .dng{background:#6b2a26;color:#ffd5d0}
.dlg .acts .row2{flex-basis:100%}
.dlg .big{display:block;width:100%;margin-top:10px;padding:18px 12px;border:0;border-radius:14px;font-size:18px;
  font-weight:600;background:var(--card2);color:var(--text)}
.dlg .big:active{background:var(--bar)}
.dlg .big.tv{background:var(--bar);color:#fff}
.dlg .sws{display:flex;gap:10px;margin-top:6px}
.dlg .sw{flex:1;border:2px solid transparent;background:var(--card2);border-radius:14px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.dlg .sw i{width:40px;height:40px;border-radius:50%;display:block}
.dlg .sw.on{border-color:#fff}
.dlg .nms .sw{padding:12px 4px;font-size:13.5px;text-align:center}
.dlg .big.cx{background:transparent;color:var(--muted);font-weight:400;font-size:16px;padding:12px}
.dlg .pv{margin-top:12px;padding:10px;border-radius:10px;background:var(--card2);font-size:13.5px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:#101312;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;max-width:88vw;
  opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}

/* ---------- หน้ากรอกรหัส ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#lock[hidden]{display:none}
#lock .lk-ic{width:56px;height:56px;border-radius:50%;background:var(--bar);display:flex;align-items:center;justify-content:center}
#lock .lk-ic svg{width:30px;height:30px;fill:#fff}
#lock h2{margin:14px 0 4px;font-size:20px;font-weight:600}
#lock .lk-msg{min-height:22px;font-size:14px;color:var(--muted);margin-bottom:14px}
#lock .lk-msg.err{color:var(--down)}
#lock .dots{display:flex;gap:16px;margin-bottom:26px;height:18px}
#lock .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
#lock .dots i.on{background:var(--accent);border-color:var(--accent)}
#lock .dots.shake{animation:lkshake .35s}
@keyframes lkshake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
#lock .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
#lock .pad button{height:76px;border-radius:50%;border:0;background:var(--card);font-size:30px;font-weight:500;color:var(--text)}
#lock .pad button:active{background:var(--bar)}
#lock .pad .ghost{background:transparent}
#lock .pad .ghost:active{background:rgba(255,255,255,.12)}
#lock .pad svg{width:30px;height:30px;fill:currentColor}
#lock .lk-note{margin-top:26px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button class="ib" id="btnBack" aria-label="กลับ" hidden>
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
    </button>
    <h1 id="title">Overview</h1>
    <button class="ib" id="btnUi" aria-label="ปรับแต่งหน้าตา"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="2" height="18" rx="1"/><rect x="11" y="3" width="2" height="18" rx="1"/><rect x="17" y="3" width="2" height="18" rx="1"/><circle cx="6" cy="14" r="3.2"/><circle cx="12" cy="8" r="3.2"/><circle cx="18" cy="15.5" r="3.2"/></svg></button>
    <button class="ib" id="btnLock" aria-label="เปิด/ปิดการถามรหัสผ่าน"></button>
    <button class="ib" id="btnRefresh" aria-label="รีเฟรชราคา">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
    </button>
    <button class="ib" id="btnPie" aria-label="ดูสัดส่วนทุกพอร์ต">
      <svg viewBox="0 0 24 24"><path d="M11 2v9.1H20.9A10 10 0 0 0 11 2zM13 4.1A8 8 0 0 1 19 11h-6zM9 4.1A8 8 0 1 0 19.9 13H9z"/></svg>
    </button>
    <button class="ib" id="btnAdd" aria-label="เพิ่ม">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    </button>
    <button class="ib" id="btnMenu" aria-label="เมนู">
      <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
    </button>
  </header>
  <nav id="tabs" hidden>
    <button data-tab="holdings">HOLDINGS</button>
    <button data-tab="details">DETAILS</button>
  </nav>
  <div id="status"></div>
  <div id="colhead" class="grid" hidden></div>
  <main id="main"></main>
  <footer id="foot" class="grid" hidden></footer>
</div>
<div id="lock">
  <div class="lk-ic"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg></div>
  <h2>ใส่รหัสผ่าน</h2>
  <div class="lk-msg" id="lkMsg">กดตัวเลขเพื่อเข้าแอป</div>
  <div class="dots" id="lkDots"></div>
  <div class="pad" id="lkPad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="ghost" disabled></button><button data-k="0">0</button>
    <button class="ghost" data-k="del" aria-label="ลบ"><svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg></button>
  </div>
</div>
<div id="scrim" hidden></div>
<div id="menu" hidden></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ====================== ค่าคงที่ ====================== */
var KEY = "pf.v1";
var CSYM = {THB:"฿",USD:"$",EUR:"€",GBP:"£",VND:"₫",JPY:"¥",CNY:"¥",HKD:"HK$",SGD:"S$",KRW:"₩",TWD:"NT$"};
var CURS = ["THB","USD","EUR","VND","GBP","JPY","CNY","HKD","SGD","KRW","TWD"];
var SUFCUR = {".BK":"THB",".PA":"EUR",".DE":"EUR",".AS":"EUR",".MI":"EUR",".MC":"EUR",".BR":"EUR",
  ".LS":"EUR",".HE":"EUR",".VI":"EUR",".IR":"EUR",".L":"GBP",".VN":"VND",".T":"JPY",".HK":"HKD",
  ".SI":"SGD",".SS":"CNY",".SZ":"CNY",".KS":"KRW",".TW":"TWD"};

/* ====================== ตัวช่วย ====================== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function csym(c){return CSYM[c]||(c+" ");}
function z(n){return Math.abs(n)<0.005?0:n;}
function fmt(n){
  var a=Math.abs(n), d=a>=10000?0:((a>0&&a<1)?4:2);
  return a.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function money(n,cur,sign){
  if(n==null||!isFinite(n)) return "—";
  if(sign) n=z(n);
  var s=n<0?"-":(sign&&n>0?"+":"");
  return s+(cur?csym(cur):"")+fmt(n);
}
function pct(n,sign){
  if(n==null||!isFinite(n)) return "—";
  n=z(n);
  return (n<0?"-":(sign&&n>0?"+":""))+Math.abs(n).toFixed(2)+"%";
}
function cls(n){n=z(n||0);return n>0?"up":(n<0?"down":"flat");}
function qtyTxt(q){return Number(Number(q).toFixed(4)).toLocaleString("en-US",{maximumFractionDigits:4});}
function guessCur(sym){
  var i=sym.lastIndexOf(".");
  if(i>0){var c=SUFCUR[sym.slice(i).toUpperCase()]; if(c) return c;}
  return "USD";
}
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},2600);
}

/* ====================== ข้อมูล (เก็บในเครื่องเท่านั้น) ====================== */
var db = loadDB();
function loadDB(){
  try{
    var v=JSON.parse(localStorage.getItem(KEY)||"null");
    if(v && Array.isArray(v.portfolios)) return v;
  }catch(e){}
  return {portfolios:[]};
}
function saveDB(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){toast("บันทึกลงเครื่องไม่ได้ โปรดตรวจสอบพื้นที่/โหมดส่วนตัวของเบราว์เซอร์");}
}
function getP(id){return db.portfolios.filter(function(p){return p.id===id;})[0];}

/* ====================== ราคา (อ่านจาก prices.json) ====================== */
var prices = {updated:null, fx:{THB:1}, quotes:{}, valuation:{}};
var lastLoad = 0;
function applyPrices(j){
  prices = {updated:j.updated||null, fx:Object.assign({THB:1}, j.fx||{}), quotes:j.quotes||{}, valuation:j.valuation||{}};
}
function loadPrices(manual){
  var btn=$("btnRefresh"); btn.classList.add("spin");
  return fetch("prices.json?t="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();})
    .then(function(j){
      applyPrices(j); lastLoad=Date.now();
      try{localStorage.setItem("pf.prices",JSON.stringify(j));}catch(e){}
      if(manual) toast("โหลดราคาล่าสุดแล้ว");
    })
    .catch(function(){
      if(!prices.updated){
        try{var c=JSON.parse(localStorage.getItem("pf.prices")||"null"); if(c) applyPrices(c);}catch(e){}
      }
      if(manual) toast("โหลดราคาไม่ได้ ใช้ราคาที่เก็บไว้ในเครื่อง");
    })
    .then(function(){btn.classList.remove("spin"); render();});
}
function latestQuoteTime(){
  var t=0, q=prices.quotes;
  Object.keys(q).forEach(function(k){if(q[k].t && q[k].t>t) t=q[k].t;});
  return t;
}
function rateOf(cur){return cur==="THB"?1:(prices.fx[cur]||null);}

/* ====================== การคำนวณ ====================== */
function calc(h){
  var q=h.manual?null:prices.quotes[h.sym];
  var cur=h.manual?h.manual.cur:(q?q.currency:guessCur(h.sym));
  var price=h.manual?h.manual.price:(q?q.price:null);
  var prev=(q&&q.prevClose!=null)?q.prevClose:null;
  var value=price==null?null:h.qty*price;
  var cost=h.qty*h.cost;
  var day=(price!=null&&prev!=null)?h.qty*(price-prev):0;
  var rate=rateOf(cur);
  var miss=(price==null)||(rate==null);
  return {
    h:h, cur:cur, price:price, value:value, cost:cost, noQuote:(price==null), noFx:(rate==null),
    pl: value==null?null:value-cost,
    plPct: (value!=null&&cost>0)?(value-cost)/cost*100:0,
    day: day, dayPct:(price!=null&&prev)?(price/prev-1)*100:0,
    valueTHB: miss?null:value*rate, costTHB: rate==null?null:cost*rate, dayTHB: miss?null:day*rate,
    missing: miss
  };
}
function totals(cs){
  var t={v:0,c:0,d:0,miss:0};
  cs.forEach(function(x){
    if(x.missing){t.miss++;return;}
    t.v+=x.valueTHB; t.c+=x.costTHB; t.d+=x.dayTHB;
  });
  t.pl=t.v-t.c; t.plPct=t.c>0?t.pl/t.c*100:0;
  var base=t.v-t.d; t.dayPct=base>0?t.d/base*100:0;
  return t;
}
function portfolioCalcs(p){return p.holdings.map(calc);}

var TV_EX={".BK":"SET",".HK":"HKEX",".SZ":"SZSE",".SS":"SSE",".T":"TSE",".L":"LSE",".PA":"EURONEXT",".AS":"EURONEXT",
  ".BR":"EURONEXT",".LS":"EURONEXT",".DE":"XETR",".MI":"MIL",".MC":"BME",".SW":"SIX",".SI":"SGX",".KS":"KRX",
  ".KQ":"KRX",".TW":"TWSE",".AX":"ASX",".TO":"TSX",".VN":"HOSE",".HE":"OMXHEX",".ST":"OMXSTO",".CO":"OMXCOP",".OL":"OSL"};
var TV_FUT={"GC":"COMEX:GC1!","SI":"COMEX:SI1!","HG":"COMEX:HG1!","PL":"NYMEX:PL1!","CL":"NYMEX:CL1!","BZ":"NYMEX:BZ1!",
  "NG":"NYMEX:NG1!","ES":"CME_MINI:ES1!","NQ":"CME_MINI:NQ1!","ZC":"CBOT:ZC1!","ZS":"CBOT:ZS1!","ZW":"CBOT:ZW1!"};
function tvSymbol(sym){
  sym=String(sym).trim().toUpperCase();
  var m=/^([A-Z0-9]+)=F$/.exec(sym); if(m&&TV_FUT[m[1]]) return TV_FUT[m[1]];
  m=/^([A-Z]{6})=X$/.exec(sym); if(m) return "FX_IDC:"+m[1];
  m=/^([A-Z0-9]+)-USD$/.exec(sym); if(m) return "BINANCE:"+m[1]+"USDT";
  var i=sym.lastIndexOf(".");
  if(i>0){
    var ex=TV_EX[sym.slice(i)], code=sym.slice(0,i);
    if(ex){
      if(ex==="HKEX") code=code.replace(/^0+(?=\d)/,"");
      return ex+":"+code;
    }
  }
  return sym.replace("-",".");   // หุ้นสหรัฐ: ให้ TradingView เลือกตลาดหลักเอง (BRK-B -> BRK.B)
}

function valuationHTML(cs){

      var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      var x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1),x3=cx+r*Math.cos(a0),y3=cy+r*Math.sin(a0);
      paths+='<path data-i="'+i+'" d="M'+x0.toFixed(3)+' '+y0.toFixed(3)+' A'+R+' '+R+' 0 '+lg+' 1 '+x1.toFixed(3)+' '+y1.toFixed(3)+
           ' L'+x2.toFixed(3)+' '+y2.toFixed(3)+' A'+r+' '+r+' 0 '+lg+' 0 '+x3.toFixed(3)+' '+y3.toFixed(3)+
           ' Z" fill="'+colorAt(i)+'" stroke="#2a2d2c" stroke-width="0.4"/>';
      var am=(a0+a1)/2, rm=(R+r)/2, tx=cx+rm*Math.cos(am), ty=cy+rm*Math.sin(am);
      if(fr>=0.07){
        labels+='<text text-anchor="middle" fill="#1b1f1d" font-size="3.4" font-weight="600">'+
          '<tspan x="'+tx.toFixed(2)+'" y="'+(ty-0.3).toFixed(2)+'">'+esc(shortName(cs[i].h.sym,7))+'</tspan>'+
          '<tspan x="'+tx.toFixed(2)+'" dy="3.8">'+(fr*100).toFixed(1)+'%</tspan></text>';
      } else if(fr>=0.035){
        labels+='<text x="'+tx.toFixed(2)+'" y="'+(ty+1).toFixed(2)+'" text-anchor="middle" fill="#1b1f1d" font-size="2.8" font-weight="600">'+
          (fr*100).toFixed(1)+'%</text>';
      }
      a0=a1;
    }
  }
  var legend=cs.map(function(x,j){
    return '<div class="lg" data-i="'+j+'"><i style="background:'+colorAt(j)+'"></i><span>'+esc(x.h.sym)+'</span>'+
      '<span class="p">'+pctTxt(x.valueTHB/tot*100)+'</span><span class="v">฿'+fmt(x.valueTHB)+'</span></div>';
  }).join("");
  var skipped=portfolioCalcs(p).length-cs.length;
  main.innerHTML='<div class="det"><svg class="pie" viewBox="-2 -2 104 104" role="img" aria-label="สัดส่วนการถือหุ้น">'+
    paths+labels+'<g id="ctr">'+centerSvg()+'</g></svg>'+
    '<div class="hint2">แตะที่ชิ้นในวงกลมหรือที่รายการด้านล่าง เพื่อดูชื่อหุ้นและสัดส่วน</div>'+
    '<div class="legend">'+legend+'</div>'+
    valuationHTML(cs)+
    (skipped>0?'<div class="empty" style="padding:14px">ไม่รวม '+skipped+' ตัวที่ยังไม่มีราคา</div>':'')+'</div>';
}

/* ---------- สัดส่วนทุกพอร์ต (pie 2 วง) ---------- */
var pies=[];
function pieSvg(pi,items,tot){
  var R=48,r=22,cx=50,cy=50,a0=-Math.PI/2,paths="",labels="",i;
  if(items.length===1){
    paths='<circle data-pk="'+pi+':0" cx="50" cy="50" r="'+((R+r)/2)+'" fill="none" stroke="'+colorAt(0)+'" stroke-width="'+(R-r)+'"/>';
    labels='<text x="50" y="'+(cy-R+r/2+2)+'" text-anchor="middle" font-size="3.6" font-weight="600" fill="#1b1f1d">100% '+esc(items[0].short)+'</text>';
  } else for(i=0;i<items.length;i++){
    var fr=items[i].v/tot,a1=a0+fr*2*Math.PI,lg=fr>0.5?1:0;
    var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    var x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1),x3=cx+r*Math.cos(a0),y3=cy+r*Math.sin(a0);
    paths+='<path data-pk="'+pi+':'+i+'" d="M'+x0.toFixed(3)+' '+y0.toFixed(3)+' A'+R+' '+R+' 0 '+lg+' 1 '+x1.toFixed(3)+' '+y1.toFixed(3)+
      ' L'+x2.toFixed(3)+' '+y2.toFixed(3)+' A'+r+' '+r+' 0 '+lg+' 0 '+x3.toFixed(3)+' '+y3.toFixed(3)+
      ' Z" fill="'+colorAt(i)+'" stroke="#2a2d2c" stroke-width="0.4"/>';
    var am=(a0+a1)/2,rm=(R+r)/2,tx=cx+rm*Math.cos(am),ty=cy+rm*Math.sin(am);
    if(fr>=0.07){
      labels+='<text text-anchor="middle" fill="#1b1f1d" font-size="3.4" font-weight="600">'+
        '<tspan x="'+tx.toFixed(2)+'" y="'+(ty-0.3).toFixed(2)+'">'+esc(items[i].short)+'</tspan>'+
        '<tspan x="'+tx.toFixed(2)+'" dy="3.8">'+(fr*100).toFixed(1)+'%</tspan></text>';
    } else if(fr>=0.035){
      labels+='<text x="'+tx.toFixed(2)+'" y="'+(ty+1).toFixed(2)+'" text-anchor="middle" fill="#1b1f1d" font-size="2.8" font-weight="600">'+
        (fr*100).toFixed(1)+'%</text>';
    }
    a0=a1;
  }
  return '<svg class="pie pie2" viewBox="-2 -2 104 104" role="img">'+paths+labels+'<g id="ctr'+pi+'">'+pieCenter(pi)+'</g></svg>';
}
function pieCenter(pi){
  var P=pies[pi],sel=P.sel;
  if(sel>=0){
    var x=P.items[sel],f=x.v/P.tot*100;
    return '<text x="50" y="43.5" text-anchor="middle" font-size="4.2" font-weight="600" fill="#eceff1">'+esc(x.short)+'</text>'+
      '<text x="50" y="52.5" text-anchor="middle" font-size="7" font-weight="700" fill="'+colorAt(sel)+'">'+pctTxt(f)+'</text>'+
      '<text x="50" y="58.5" text-anchor="middle" font-size="3.4" fill="#9aa5a0">฿'+fmt(x.v)+'</text>';
  }
  return '<text x="50" y="48.5" text-anchor="middle" font-size="3.4" fill="#9aa5a0">รวม (บาท)</text>'+
    '<text x="50" y="54.5" text-anchor="middle" font-size="5.2" font-weight="600" fill="#eceff1">'+fmt(P.tot)+'</text>';
}
function pieSelect(pi,i){
  var P=pies[pi]; P.sel=(P.sel===i)?-1:i;
  var box=document.getElementById("pb"+pi); if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll("[data-pk]"),function(el){
    var k=+el.getAttribute("data-pk").split(":")[1];
    el.classList.toggle("sel",k===P.sel&&el.tagName==="path");
    el.classList.toggle("dim",P.sel>=0&&k!==P.sel);
    if(el.classList.contains("lg")) el.classList.toggle("on",k===P.sel);
  });
  $("ctr"+pi).innerHTML=pieCenter(pi);
}
function pieBlock(pi,title,sub,items){
  items=items.filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
  var tot=items.reduce(function(s,x){return s+x.v;},0);
  pies[pi]={items:items,tot:tot,sel:-1};
  var head='<div class="pt">'+title+'<small>'+sub+'</small></div>';
  if(!items.length) return head+'<div class="empty" style="padding:14px">ยังไม่มีข้อมูล (ต้องมีหุ้นที่มีราคา)</div>';
  var legend=items.map(function(x,j){
    return '<div class="lg" data-pk="'+pi+':'+j+'"><i style="background:'+colorAt(j)+'"></i><span>'+esc(x.label)+
      (x.note?' <small style="color:var(--muted)">'+esc(x.note)+'</small>':'')+'</span>'+
      '<span class="p">'+pctTxt(x.v/tot*100)+'</span><span class="v">฿'+fmt(x.v)+'</span></div>';
  }).join("");
  return head+'<div id="pb'+pi+'">'+pieSvg(pi,items,tot)+'<div class="legend">'+legend+'</div></div>';
}
function renderAllPie(){
  $("colhead").hidden=true; $("foot").hidden=true;
  var byP=[],bySym={},skipped=0;
  db.portfolios.forEach(function(p){
    var sum=0;
    portfolioCalcs(p).forEach(function(x){
      if(x.missing||!(x.valueTHB>0)){skipped++;return;}
      sum+=x.valueTHB;
      var k=x.h.sym, o=bySym[k]||(bySym[k]={label:k,short:shortName(k,7),v:0,n:0});
      o.v+=x.valueTHB; o.n++;
    });
    byP.push({label:p.name,short:p.name.replace(/^\d+\s*/,"").slice(0,8),v:sum});
  });
  var stocks=Object.keys(bySym).map(function(k){
    var o=bySym[k]; if(o.n>1) o.note="("+o.n+" พอร์ต)"; return o;
  });
  $("main").innerHTML='<div class="det">'+
    '<div class="hint2">แตะที่ชิ้นในวงกลมหรือที่รายการ เพื่อดูสัดส่วน</div>'+
    pieBlock(0,"1) สัดส่วนแต่ละพอร์ต","มูลค่าของแต่ละพอร์ต เทียบกับทุกพอร์ตรวมกัน",byP)+
    '<hr class="sep">'+
    pieBlock(1,"2) สัดส่วนหุ้นทุกตัวรวมเป็นพอร์ตเดียว","หุ้นตัวเดียวกันในหลายพอร์ต (เช่น PTT) ถูกนำมารวมกัน",stocks)+
    (skipped>0?'<div class="empty" style="padding:14px">ไม่รวม '+skipped+' ตัวที่ยังไม่มีราคา</div>':'')+'</div>';
}

/* ====================== Dialog ====================== */
function modal(html){
  var d=document.createElement("dialog");
  d.innerHTML='<div class="dlg">'+html+'</div>';
  document.body.appendChild(d);
  d.addEventListener("close",function(){d.remove();});

}
function val(d,id){return d.querySelector("#"+id).value;}

function deletePortfolio(pid){

/* ---------- หุ้น ---------- */
function normSym(sym,p,manual){
  sym=sym.trim();
  if(manual) return sym;
  sym=sym.toUpperCase();
  if(p.suffix && !/[.=^\-]/.test(sym)) sym+=p.suffix;
  return sym;
}
function holdingChoice(pid,hid){
  var p=getP(pid); if(!p) return;
  var h=p.holdings.filter(function(x){return x.id===hid;})[0]; if(!h) return;
  var d=modal('<h2 style="margin-bottom:6px">'+esc(h.sym)+'</h2>'+
    (h.manual?'':'<button class="big tv" data-x="tv">📈 ดูกราฟ (TradingView)</button>')+
    '<button class="big" data-x="ed">✏️ แก้ไข / ซื้อ / ขาย</button>'+
    '<button class="big cx" data-x="c">ยกเลิก</button>');
  d.addEventListener("click",function(e){
    var x=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(x==="tv"){ openTV(h.sym); d.close(); }
    else if(x==="ed"){ d.close(); holdingDialog(pid,hid); }
    else if(x==="c") d.close();
  });
}
function holdingDialog(pid,hid){
  var p=getP(pid); if(!p) return;
  var h=hid?p.holdings.filter(function(x){return x.id===hid;})[0]:null;
  var man=!!(h&&h.manual);
  var opts=CURS.map(function(c){
    return '<option value="'+c+'"'+((h&&h.manual&&h.manual.cur===c)?' selected':'')+'>'+c+'</option>';
  }).join("");
  var d=modal('<h2>'+(h?'แก้ไข '+esc(h.sym):'เพิ่มหุ้นในพอร์ต')+'</h2>'+
    '<label id="lSym">ชื่อหุ้น (symbol ของ Yahoo Finance)</label>'+
    '<input id="fSym" type="text" autocapitalize="characters" autocomplete="off" value="'+esc(h?h.sym:"")+'" placeholder="เช่น PTT หรือ AAPL">'+
    '<div class="hint" id="symHint">ไทยลงท้าย .BK (เช่น PTT.BK) · ฝรั่งเศส .PA · เวียดนาม .VN · ทองคำ GC=F · เงินสด/คริปโต BTC-USD'+
    (p.suffix?'<br>พอร์ตนี้เติม <b>'+esc(p.suffix)+'</b> ให้อัตโนมัติ':'')+'</div>'+
    '<label>จำนวนหุ้น / หน่วย</label><input id="fQty" type="number" step="any" min="0" inputmode="decimal" value="'+(h?h.qty:"")+'">'+
    '<label>ต้นทุนเฉลี่ยต่อหุ้น (สกุลเงินเดียวกับราคา)</label><input id="fCost" type="number" step="any" min="0" inputmode="decimal" value="'+(h?h.cost:"")+'">'+
    '<label class="chk"><input type="checkbox" id="fMan"'+(man?' checked':'')+'> ตั้งราคาเอง (กองทุนรวม / ของที่ Yahoo ไม่มี)</label>'+
    '<div id="manBox"'+(man?'':' style="display:none"')+'>'+
      '<label>ราคาปัจจุบันต่อหน่วย</label><input id="fPrice" type="number" step="any" min="0" inputmode="decimal" value="'+(man?h.manual.price:"")+'">'+
      '<label>สกุลเงินของราคา/ต้นทุน</label><select id="fCur">'+opts+'</select>'+
      '<div class="hint">แอปจะไม่ดึงราคาให้ตัวนี้ คุณมาแก้ราคาเองเมื่อต้องการ (ตัวนี้ไม่ต้องอยู่ใน symbols.json)</div>'+
    '</div>'+
    '<div class="acts">'+
      (h?'<button class="row2" data-x="buy">ซื้อเพิ่ม</button><button class="row2" data-x="sell">ขายบางส่วน</button>':'')+
      (h?'<button class="dng" data-x="del">ลบ</button>':'<button data-x="c">ยกเลิก</button>')+
      '<button class="pri" data-x="s">บันทึก</button></div>');
  var man_ = d.querySelector("#fMan");
  man_.onchange=function(){
    d.querySelector("#manBox").style.display=man_.checked?"":"none";
    d.querySelector("#lSym").textContent=man_.checked?"ชื่อที่ต้องการแสดง":"ชื่อหุ้น (symbol ของ Yahoo Finance)";
    d.querySelector("#symHint").style.display=man_.checked?"none":"";
  };
  man_.onchange();
  if(h&&!man) d.querySelector("#symHint").style.display="none";
  d.addEventListener("click",function(e){
    var x=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(!x) return;
    if(x==="c") d.close();
    else if(x==="del"){
      if(confirm("ลบ "+h.sym+" ออกจากพอร์ต?")){
        p.holdings=p.holdings.filter(function(y){return y.id!==h.id;});
        saveDB(); d.close(); render();
      }
    }
    else if(x==="buy"||x==="sell"){d.close(); tradeDialog(pid,h.id,x);}
    else if(x==="s"){
      var isMan=man_.checked;
      var sym=normSym(val(d,"fSym"),p,isMan);
      var qty=parseFloat(val(d,"fQty")), cost=parseFloat(val(d,"fCost"));
      if(!sym){toast("ใส่ชื่อหุ้นก่อน");return;}
      if(!(qty>=0)){toast("จำนวนไม่ถูกต้อง");return;}
      if(!(cost>=0)){toast("ต้นทุนไม่ถูกต้อง");return;}
      var manual=null;
      if(isMan){
        var pr=parseFloat(val(d,"fPrice"));
        if(!(pr>=0)){toast("ใส่ราคาปัจจุบันด้วย");return;}
        manual={price:pr,cur:val(d,"fCur")};
      }
      var dup=p.holdings.filter(function(y){return y.sym===sym && (!h||y.id!==h.id);})[0];
      if(dup){toast("มี "+sym+" ในพอร์ตนี้แล้ว แตะที่แถวนั้นแล้วกด ซื้อเพิ่ม");return;}
      if(h){h.sym=sym;h.qty=qty;h.cost=cost;h.manual=manual;}
      else p.holdings.push({id:uid(),sym:sym,qty:qty,cost:cost,manual:manual});
      saveDB(); d.close(); render();
    }
  });
}
function tradeDialog(pid,hid,mode){
  var p=getP(pid), h=p.holdings.filter(function(x){return x.id===hid;})[0]; if(!h) return;
  var x=calc(h), buy=(mode==="buy");
  var d=modal('<h2>'+(buy?'ซื้อเพิ่ม ':'ขาย ')+esc(h.sym)+'</h2>'+
    '<div class="hint">ตอนนี้ถือ '+qtyTxt(h.qty)+' @ '+money(h.cost,x.cur)+'</div>'+
    '<label>จำนวนที่'+(buy?'ซื้อ':'ขาย')+'</label><input id="tQty" type="number" step="any" min="0" inputmode="decimal">'+
    '<label>ราคา'+(buy?'ที่ซื้อ':'ที่ขาย')+'ต่อหุ้น ('+x.cur+')</label>'+
    '<input id="tPrice" type="number" step="any" min="0" inputmode="decimal" value="'+(x.price!=null?x.price:"")+'">'+
    '<div class="pv" id="tPv"></div>'+
    '<div class="acts"><button data-x="c">ยกเลิก</button><button class="pri" data-x="s">ยืนยัน</button></div>');
  function preview(){
    var q=parseFloat(val(d,"tQty")), pr=parseFloat(val(d,"tPrice")), t="";
    if(q>0&&pr>=0){
      if(buy){
        var nq=h.qty+q, nc=(h.qty*h.cost+q*pr)/nq;
        t="หลังซื้อ: "+qtyTxt(nq)+" @ "+money(nc,x.cur)+" (ต้นทุนเฉลี่ยใหม่)";
      } else {
        var rq=h.qty-q;
        if(rq<0) t='<span class="nop">ขายเกินจำนวนที่ถือ</span>';
        else t="หลังขาย: เหลือ "+qtyTxt(rq)+" @ "+money(h.cost,x.cur)+"<br>กำไร/ขาดทุนที่รับรู้ครั้งนี้: "+
          '<span class="'+cls(q*(pr-h.cost))+'">'+money(q*(pr-h.cost),x.cur,true)+'</span>';
      }
    }
    d.querySelector("#tPv").innerHTML=t||'<span class="sub">กรอกจำนวนและราคา จะเห็นผลลัพธ์ตรงนี้</span>';
  }
  d.addEventListener("input",preview); preview();
  d.addEventListener("click",function(e){
    var a=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(a==="c") d.close();
    if(a==="s"){
      var q=parseFloat(val(d,"tQty")), pr=parseFloat(val(d,"tPrice"));
      if(!(q>0)||!(pr>=0)){toast("กรอกจำนวนและราคาให้ครบ");return;}
      if(buy){
        var nq=h.qty+q; h.cost=(h.qty*h.cost+q*pr)/nq; h.qty=nq;
      } else {
        if(q>h.qty+1e-9){toast("ขายเกินจำนวนที่ถือ");return;}
        h.qty=h.qty-q;
        if(h.qty<1e-9){
          if(confirm("ขายหมดแล้ว ลบ "+h.sym+" ออกจากพอร์ตเลยไหม?"))
            p.holdings=p.holdings.filter(function(y){return y.id!==h.id;});
          else h.qty=0;
        }
      }
      saveDB(); d.close(); render();
    }
  });
}

/* ---------- Export / Import ---------- */
function exportText(){
  return JSON.stringify({app:"pf",version:1,exported:new Date().toISOString(),portfolios:db.portfolios},null,1);
}
function exportDialog(){
  var txt=exportText();
  var d=modal('<h2>สำรองข้อมูล (Export)</h2>'+
    '<div class="hint">ข้อมูลทั้งหมดมีแค่ในเครื่องนี้ ไม่ได้ขึ้น GitHub เก็บไฟล์นี้ไว้เพื่อย้ายไปเครื่องใหม่ (กด Import ที่เครื่องใหม่)</div>'+
    '<div class="acts"><button class="pri" data-x="f">ดาวน์โหลดเป็นไฟล์</button><button data-x="cp">คัดลอกข้อความ</button></div>'+
    '<div class="acts"><button data-x="c">ปิด</button></div>');
  d.addEventListener("click",function(e){
    var a=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(a==="c") d.close();
    if(a==="f"){
      var blob=new Blob([txt],{type:"application/json"}), el=document.createElement("a");
      el.href=URL.createObjectURL(blob);
      el.download="portfolio-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(el); el.click(); el.remove();
      setTimeout(function(){URL.revokeObjectURL(el.href);},4000);
      toast("ดาวน์โหลดแล้ว");
    }
    if(a==="cp") copyText(txt,"คัดลอกแล้ว");
  });
}
function copyText(txt,okMsg){
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ok=document.execCommand("copy");}catch(e){}
    ta.remove(); toast(ok?okMsg:"คัดลอกไม่ได้ ลองกดค้างที่ข้อความเอง");
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},fallback);
  else fallback();
}
function importFromText(txt){
  var v; try{v=JSON.parse(txt);}catch(e){return "ข้อความ/ไฟล์ไม่ใช่ JSON ที่ถูกต้อง";}
  var list=Array.isArray(v)?v:(v&&v.portfolios);
  if(!Array.isArray(list)) return "ไม่พบข้อมูลพอร์ตในไฟล์";
  var out=list.map(function(p){
    if(!p||typeof p.name!=="string"||!Array.isArray(p.holdings)) return null;
    return {id:String(p.id||uid()),name:p.name,suffix:String(p.suffix||""),
      holdings:p.holdings.map(function(h){
        if(!h||!h.sym||!(+h.qty>=0)||!(+h.cost>=0)) return null;
        var m=null;
        if(h.manual&&+h.manual.price>=0) m={price:+h.manual.price,cur:String(h.manual.cur||"THB")};
        return {id:String(h.id||uid()),sym:String(h.sym),qty:+h.qty,cost:+h.cost,manual:m};
      }).filter(Boolean)};
  }).filter(Boolean);
  if(!out.length) return "ไม่พบพอร์ตที่อ่านได้";
  var n=out.reduce(function(s,p){return s+p.holdings.length;},0);
  if(db.portfolios.length && !confirm("นำเข้า "+out.length+" พอร์ต "+n+" ตัว\nข้อมูลในเครื่องนี้ตอนนี้จะถูกแทนที่ทั้งหมด ดำเนินการต่อ?")) return "ยกเลิก";
  db={portfolios:out}; saveDB();
  view={name:"overview",id:null,tab:"holdings"}; render();
  return "";
}
function importDialog(){
  var d=modal('<h2>นำเข้าข้อมูล (Import)</h2>'+
    '<div class="hint">เลือกไฟล์สำรองที่ได้จาก Export หรือวางข้อความที่คัดลอกไว้</div>'+
    '<div class="acts"><button class="pri" data-x="pick">เลือกไฟล์</button></div>'+
    '<label>หรือวางข้อความที่นี่</label><textarea id="iTxt"></textarea>'+
    '<input type="file" id="iFile" accept="application/json,.json" hidden>'+
    '<div class="acts"><button data-x="c">ยกเลิก</button><button class="pri" data-x="go">นำเข้าจากข้อความ</button></div>');
  var f=d.querySelector("#iFile");
  f.onchange=function(){
    var file=f.files[0]; if(!file) return;
    var rd=new FileReader();
    rd.onload=function(){var m=importFromText(String(rd.result)); if(m){if(m!=="ยกเลิก")toast(m);} else {d.close();toast("นำเข้าแล้ว");}};
    rd.readAsText(file);
  };
  d.addEventListener("click",function(e){
    var a=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(a==="c") d.close();
    if(a==="pick") f.click();
    if(a==="go"){
      var t=val(d,"iTxt").trim(); if(!t){toast("ยังไม่ได้วางข้อความ");return;}
      var m=importFromText(t); if(m){if(m!=="ยกเลิก")toast(m);} else {d.close();toast("นำเข้าแล้ว");}
    }
  });
}

/* ---------- symbols.json ---------- */
function symbolsText(){
  var syms={}, curs={USD:1};
  db.portfolios.forEach(function(p){p.holdings.forEach(function(h){
    if(h.manual){ if(h.manual.cur!=="THB") curs[h.manual.cur]=1; }
    else { syms[h.sym]=1; var gc=(prices.quotes[h.sym]&&prices.quotes[h.sym].currency)||guessCur(h.sym); if(gc!=="THB") curs[gc]=1; }
  });});
  return JSON.stringify({symbols:Object.keys(syms).sort(),currencies:Object.keys(curs).sort()},null,2)+"\n";
}
function symbolsDialog(fromWarn){
  var txt=symbolsText();
  var d=modal('<h2>รายชื่อหุ้นสำหรับ GitHub</h2>'+
    '<div class="hint">'+(fromWarn?'มีหุ้นที่ยังไม่มีราคา เพราะยังไม่อยู่ในไฟล์ <b>symbols.json</b> บน GitHub (หรือพิมพ์ชื่อผิด)<br>':'')+
    'วิธีอัปเดต: ① กดคัดลอก ② เปิดไฟล์ symbols.json ใน GitHub กดรูปดินสอ ③ ลบของเดิมทั้งหมดแล้ววางทับ ④ กด Commit — GitHub จะดึงราคาให้เองภายในไม่กี่นาที แล้วกด ⟳ ในแอป</div>'+
    '<label>เนื้อหาไฟล์ symbols.json ทั้งไฟล์</label><textarea id="sTxt" readonly>'+esc(txt)+'</textarea>'+
    '<div class="acts"><button data-x="c">ปิด</button><button class="pri" data-x="cp">คัดลอก</button></div>'+
    (/\.github\.io$/.test(location.hostname)?'<div class="acts"><button data-x="gh">เปิดหน้าแก้ไข symbols.json บน GitHub</button></div>':''));
  d.addEventListener("click",function(e){
    var a=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(a==="c") d.close();
    if(a==="cp") copyText(txt,"คัดลอกแล้ว");

      var user=location.hostname.split(".")[0];
      var repo=location.pathname.split("/").filter(Boolean)[0]||"";
      window.open("https://github.com/"+user+"/"+repo+"/edit/main/symbols.json","_blank");
    }
  });
}

/* ====================== ปรับแต่งหน้าตา (สีแถบด้านบน + ชื่อหน้าหลัก) ====================== */
var THEMES=[
  {id:"green", name:"เขียว",   bar:"#1f6b43", dark:"#185536", dim:"#b7d9c5"},
  {id:"blue",  name:"น้ำเงิน", bar:"#1f5f8f", dark:"#184a70", dim:"#b9d4ea"},
  {id:"purple",name:"ม่วง",    bar:"#5e3d92", dark:"#4a2f74", dim:"#d3c6ea"},
  {id:"orange",name:"ส้ม",     bar:"#a2501c", dark:"#803e15", dim:"#f0cdb4"}
];
var ui={c:"green",t:"",n:"full"};
try{var u0=JSON.parse(localStorage.getItem("pf.ui")||"null"); if(u0&&typeof u0==="object"){ui.c=u0.c||"green"; ui.t=String(u0.t||"").slice(0,24); ui.n=(u0.n==="compact"||u0.n==="off")?u0.n:"full";}}catch(e){}
function saveUi(){try{localStorage.setItem("pf.ui",JSON.stringify(ui));}catch(e){}}
function applyUi(){
  var th=THEMES.filter(function(x){return x.id===ui.c;})[0]||THEMES[0], r=document.documentElement.style;
  r.setProperty("--bar",th.bar); r.setProperty("--bar-dark",th.dark); r.setProperty("--bar-dim",th.dim);
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",th.bar);
}
function uiDialog(){
  var sw=THEMES.map(function(t){
    return '<button class="sw'+(t.id===ui.c?' on':'')+'" data-c="'+t.id+'"><i style="background:'+t.bar+'"></i><span>'+t.name+'</span></button>';
  }).join("");
  var d=modal('<h2>ปรับแต่งหน้าตา</h2>'+
    '<label>สีแถบด้านบน</label><div class="sws">'+sw+'</div>'+
    '<label>ชื่อหน้าหลัก (แทนคำว่า Overview)</label>'+
    '<input id="uiT" type="text" maxlength="24" autocomplete="off" placeholder="Overview" value="'+esc(ui.t)+'">'+
    '<label>ชื่อเต็มของหุ้น ในหน้าพอร์ต</label><div class="sws nms">'+
      [["full","แยกบรรทัด"],["compact","ต่อท้ายจำนวนหุ้น"],["off","ไม่แสดง"]].map(function(o){
        return '<button class="sw'+((ui.n||"full")===o[0]?' on':'')+'" data-n="'+o[0]+'"><span>'+o[1]+'</span></button>';}).join("")+'</div>'+
    '<div class="hint">แยกบรรทัด = อ่านชื่อได้เต็ม แต่แถวสูงขึ้น · ต่อท้ายจำนวนหุ้น = แถวสูงเท่าเดิม แต่ชื่อยาวจะถูกตัด</div>'+
    '<div class="acts"><button data-x="rs">ตั้งค่าเดิม</button><button class="pri" data-x="ok">ตกลง</button></div>');
  function mark(){Array.prototype.forEach.call(d.querySelectorAll(".sw[data-c]"),function(b){b.classList.toggle("on",b.getAttribute("data-c")===ui.c);});}
  d.addEventListener("click",function(e){
    var b=e.target.closest(".sw");
    if(b&&b.hasAttribute("data-n")){
      ui.n=b.getAttribute("data-n"); saveUi();
      Array.prototype.forEach.call(d.querySelectorAll(".sw[data-n]"),function(z){z.classList.toggle("on",z===b);});
      return;
    }
    if(b){ui.c=b.getAttribute("data-c"); saveUi(); applyUi(); mark(); return;}
    var x=e.target.getAttribute&&e.target.getAttribute("data-x");
    if(x==="rs"){ui={c:"green",t:"",n:"full"}; saveUi(); applyUi(); d.close(); render();}
    else if(x==="ok"){ui.t=val(d,"uiT").trim().slice(0,24); saveUi(); d.close(); render();}
  });
}
$("btnUi").onclick=uiDialog;
applyUi();

/* ====================== รหัสผ่านเข้าแอป (กันคนที่บังเอิญเปิดลิงก์เข้ามา) ====================== */
var LOCK_CODE="99", lkIn="";
function lkGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lkSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lkSessionOk(){try{return sessionStorage.getItem("pf.ok")==="1";}catch(e){return false;}}
function lkAsking(){return lkGet("pf.lockoff")!=="1";}   // true = ถามรหัสทุกครั้งที่เปิดแอป
var ICON_LOCK='<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg>';
var ICON_OPEN='<svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h2c0-1.66 1.34-3 3-3s3 1.34 3 3v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/></svg>';
function lkIcon(){$("btnLock").innerHTML=lkAsking()?ICON_LOCK:ICON_OPEN;}
function lkDots(){
  var h="",i; for(i=0;i<LOCK_CODE.length;i++) h+='<i'+(i<lkIn.length?' class="on"':'')+'></i>';
  $("lkDots").innerHTML=h;
}
function lkPress(k){
  if($("lock").hidden) return;
  if(k==="del"){lkIn=lkIn.slice(0,-1);}
  else if(lkIn.length<LOCK_CODE.length){lkIn+=k;}
  lkDots();
  $("lkMsg").className="lk-msg"; $("lkMsg").textContent="กดตัวเลขเพื่อเข้าแอป";
  if(lkIn.length===LOCK_CODE.length){
    if(lkIn===LOCK_CODE){
      try{sessionStorage.setItem("pf.ok","1");}catch(e){}
      lkIn=""; $("lock").hidden=true;
    } else {
      $("lkMsg").className="lk-msg err"; $("lkMsg").textContent="รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง";
      var d=$("lkDots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      setTimeout(function(){lkIn="";lkDots();},350);
    }
  }
}
$("lkPad").onclick=function(e){
  var b=e.target.closest("[data-k]"); if(b) lkPress(b.getAttribute("data-k"));
};
document.addEventListener("keydown",function(e){
  if($("lock").hidden) return;
  if(/^[0-9]$/.test(e.key)) lkPress(e.key);
  else if(e.key==="Backspace") lkPress("del");
});
$("btnLock").onclick=function(){
  if(lkAsking()){ lkSet("pf.lockoff","1"); toast("ปิดล็อกแล้ว: ครั้งต่อไปเข้าแอปได้เลย ไม่ต้องใส่รหัส"); }
  else { lkSet("pf.lockoff","0"); toast("เปิดล็อกแล้ว: ต้องใส่รหัสทุกครั้งที่เปิดแอป"); }
  lkIcon();
};
lkDots(); lkIcon();
$("lock").hidden = lkSessionOk() || !lkAsking();

/* ====================== เริ่มทำงาน ====================== */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && Date.now()-lastLoad>5*60*1000) loadPrices(false);
});
render();
try{var c=JSON.parse(localStorage.getItem("pf.prices")||"null"); if(c){applyPrices(c); render();}}catch(e){}
loadPrices(false);
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
</script>
