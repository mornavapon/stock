<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Stock</title>
<style>
  :root {
    --bg: #000000;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
    --box: #5a5a5a;
    --up: #b5f26a;
    --down: #ff7b7b;
    --warn: #ffd166;
    --rows: 28; /* จำนวนแถวสูงสุดที่แสดงในแต่ละกรอบ เกินนี้ให้เลื่อนนิ้ว */
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f3;
      --fg: #161a18;
      --muted: #666d69;
      --box: #b5bab6;
      --up: #0e7a33;
      --down: #c62828;
      --warn: #8a5a00;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 600 15px/1.5 var(--font);
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  header {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin-bottom: 10px; color: var(--muted); font-weight: 500;
  }
  header.old #stamp { color: var(--warn); }
  .tools { display: flex; align-items: center; gap: 8px; }
  #sort { font-size: 14px; }
  button {
    font: inherit; color: var(--fg); background: transparent; cursor: pointer;
    border: 1px solid var(--box); border-radius: 6px; padding: 2px 10px;
  }
  button:focus-visible { outline: 2px solid var(--up); outline-offset: 2px; }
  #pages { display: block; }
  .page { column-width: 21rem; column-gap: 10px; }
  .col { display: contents; }
  #dots { display: none; }
  .box {
    break-inside: avoid; margin-bottom: 10px; padding: 4px 8px;
    border: 1px dashed var(--box); border-radius: 8px;
    max-height: calc(var(--rows) * 24px + 10px);
    overflow-y: auto; overscroll-behavior: auto;
    scrollbar-width: thin; scrollbar-color: var(--box) transparent;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 1px 0 1px 8px; line-height: 22px; text-align: right; white-space: nowrap; }
  td.sym { padding-left: 0; text-align: left; max-width: 6.5rem; overflow: hidden; text-overflow: ellipsis; }
  td.none { color: var(--muted); font-weight: 400; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }
  #note { color: var(--muted); font-weight: 400; font-size: 13px; margin: 4px 2px 0; overflow-wrap: anywhere; }
  /* มือถือ: แสดงครบ 4 คอลัมน์ (ชื่อ ราคา เปลี่ยน %เปลี่ยน) ตัวเล็กลงนิดหนึ่งให้พอดีจอ และจำกัดจำนวนแถวของบางกรอบ */
  @media (max-width: 560px) {
    table { font-size: 14px; }
    td { padding-left: 6px; }
    .box { max-height: calc(var(--rows-phone, var(--rows)) * 24px + 10px); }
  }
  /* จอกว้าง (tablet แนวนอน): แบ่งเป็นคอลัมน์สูงเท่าจอ กรอบที่ยาวจะหดลงและเลื่อนนิ้วดู */
  @media (min-width: 1100px) {
    body {
      height: 100dvh; display: flex; flex-direction: column;
      padding-bottom: max(44px, env(safe-area-inset-bottom)); /* เว้นขอบล่าง ให้ทุกคอลัมน์จบพร้อมกัน */
    }
    /* หลายหน้า: ปัดซ้าย-ขวาเพื่อสลับหน้า */
    #pages {
      flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
    }
    #pages::-webkit-scrollbar { display: none; }
    .page {
      column-width: auto; flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always;
      display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr); gap: 10px; padding-right: 1px;
    }
    body.multi #dots {
      display: flex; gap: 12px; position: fixed; left: 0; right: 0;
      bottom: max(12px, env(safe-area-inset-bottom)); justify-content: center;
    }
    #dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 1px solid var(--muted); background: transparent; }
    #dots button.on { background: var(--fg); border-color: var(--fg); }
    .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .box { margin-bottom: 0; flex: 0 0 auto; }
    .box.big { flex: 0 1 auto; min-height: 7rem; }
  }
</style>
</head>
<body>
<header id="top">
  <span id="stamp">กำลังโหลด…</span>
  <span class="tools">
    <button id="sort" type="button"></button>
    <button id="refresh" type="button" aria-label="รีเฟรชราคา">↻</button>
  </span>
</header>
<main id="pages"></main>
<div id="dots" aria-label="หน้า"></div>
<p id="note"></p>

<script>
(function () {
  var STALE_MIN = 60;      // ถ้าข้อมูลเก่ากว่านี้ (นาที) จะขึ้นสีเตือน
  var AUTO_MS = 5 * 60000; // รีเฟรชเองทุก 5 นาที
  // กรอบไหนอยู่คอลัมน์ไหนบนจอกว้าง (ถ้าใน tickers.json ใส่ "col": เลข ไว้ จะใช้เลขนั้นแทน)
  var DEFAULT_COL = {
    "ดัชนีไทย": 1, "หุ้นไทย 1": 1,
    "หุ้นไทย 2": 2, "ETF เวียดนามและฮ่องกง": 2, "น้ำมัน ทอง แก๊ส": 2,
    "ค่าเงินบาท": 3, "คริปโต": 3, "ดัชนีสหรัฐ": 3, "หุ้นสหรัฐ": 3
  };
  // บนมือถือ กรอบไหนให้เห็นกี่แถวก่อนเลื่อนนิ้ว (ถ้าใน tickers.json ใส่ "phoneRows": เลข ไว้ จะใช้เลขนั้นแทน)
  var PHONE_ROWS = { "หุ้นไทย 2": 10 };

  function $(id) { return document.getElementById(id); }

  function getJSON(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    });
  }

  function num(n, d) {
    return n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  // ค่าที่ปัดแล้วเป็นศูนย์ ให้ถือว่าเป็น 0 จริงๆ จะได้ไม่ขึ้น -0.00
  function zero(n, d) { return Math.abs(n) < 0.5 * Math.pow(10, -d) ? 0 : n; }
  function signed(n, d) { n = zero(n, d); return (n > 0 ? "+" : "") + num(n, d); }
  function cls(n, d) { n = zero(n, d); return n > 0 ? "up" : n < 0 ? "down" : "flat"; }

  function cell(text, className) {
    var td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    return td;
  }

  var tickersCache = null;
  var pricesCache = null;
  var sortMode = "custom"; // "custom" = ตามลำดับใน tickers.json, "pct" = ตาม % เปลี่ยน มากไปน้อย
  try { if (localStorage.getItem("stock-sort") === "pct") sortMode = "pct"; } catch (e) {}

  function ordered(symbols, quotes) {
    if (sortMode !== "pct") return symbols;
    return symbols
      .map(function (s, i) { return { s: s, i: i, q: quotes[s] }; })
      .sort(function (a, b) {
        if (!a.q && !b.q) return a.i - b.i;
        if (!a.q) return 1;
        if (!b.q) return -1;
        return (b.q.pct - a.q.pct) || (a.i - b.i);
      })
      .map(function (x) { return x.s; });
  }

  function updateSortBtn() {
    var btn = $("sort");
    btn.textContent = sortMode === "pct" ? "↕ เรียงตาม %" : "↕ เรียงตามที่ตั้ง";
    btn.setAttribute("aria-label", "สลับวิธีเรียงหุ้น ตอนนี้: " + (sortMode === "pct" ? "ตามเปอร์เซ็นต์ที่เปลี่ยน" : "ตามลำดับที่ตั้งไว้"));
  }

  var curPage = 0;
  function wide() { return window.matchMedia("(min-width: 1100px)").matches; }
  function goPage(i, smooth) {
    var pg = $("pages");
    if (!wide()) return;
    pg.scrollTo({ left: i * pg.clientWidth, behavior: smooth ? "smooth" : "auto" });
  }
  function markDots() {
    var pg = $("pages");
    var i = pg.clientWidth ? Math.round(pg.scrollLeft / pg.clientWidth) : 0;
    curPage = i;
    var ds = $("dots").children;
    for (var k = 0; k < ds.length; k++) ds[k].classList.toggle("on", k === i);
  }

  function render(tickers, prices) {
    var quotes = (prices && prices.quotes) || {};
    var pagesEl = $("pages");
    pagesEl.textContent = "";
    var missing = [];
    var pageSets = {};

    tickers.groups.forEach(function (g) {
      var pageNo = g.page || 1;
      if (!pageSets[pageNo]) pageSets[pageNo] = {};
      var colEls = pageSets[pageNo];
      var colNo = g.col || DEFAULT_COL[g.name] || 1;
      if (!colEls[colNo]) {
        colEls[colNo] = document.createElement("div");
        colEls[colNo].className = "col";
        colEls[colNo].style.gridColumn = colNo;
      }
      var box = document.createElement("div");
      box.className = "box" + (g.symbols.length > 8 ? " big" : "");
      var phoneRows = g.phoneRows || PHONE_ROWS[g.name];
      if (phoneRows) box.style.setProperty("--rows-phone", phoneRows);
      var table = document.createElement("table");
      table.setAttribute("aria-label", g.name || "");
      ordered(g.symbols, quotes).forEach(function (s) {
        var q = quotes[s];
        var tr = document.createElement("tr");
        var sym = cell(s, "sym");
        sym.title = s;
        tr.appendChild(sym);
        if (q) {
          tr.appendChild(cell(num(q.p, 2)));
          tr.appendChild(cell(signed(q.c, 2), cls(q.c, 2)));
          tr.appendChild(cell(signed(q.pct, 2) + "%", "pct " + cls(q.pct, 2)));
        } else {
          missing.push(s);
          tr.appendChild(cell("—", "none"));
          tr.appendChild(cell("", "none"));
          tr.appendChild(cell("", "none pct"));
        }
        table.appendChild(tr);
      });
      box.appendChild(table);
      colEls[colNo].appendChild(box);
    });

    var pageNos = Object.keys(pageSets).map(Number).sort(function (a, b) { return a - b; });
    pageNos.forEach(function (p) {
      var colEls = pageSets[p];
      var page = document.createElement("section");
      page.className = "page";
      var colNos = Object.keys(colEls).map(Number).sort(function (a, b) { return a - b; });
      colNos.forEach(function (n) { page.appendChild(colEls[n]); });
      page.style.setProperty("--cols", Math.max(3, colNos[colNos.length - 1]));
      pagesEl.appendChild(page);
    });

    var dots = $("dots");
    dots.textContent = "";
    pageNos.forEach(function (p, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "หน้า " + (i + 1));
      b.addEventListener("click", function () { goPage(i, true); });
      dots.appendChild(b);
    });
    document.body.classList.toggle("multi", pageNos.length > 1);
    if (curPage >= pageNos.length) curPage = 0;
    goPage(curPage, false);
    markDots();

    var top = $("top");
    var stamp = $("stamp");
    top.classList.remove("old");
    if (prices && prices.updated) {
      var d = new Date(prices.updated);
      var hh = String(d.getHours()).padStart(2, "0");
      var mm = String(d.getMinutes()).padStart(2, "0");
      var ageMin = (Date.now() - d.getTime()) / 60000;
      stamp.textContent = "อัปเดต " + hh + ":" + mm;
      if (ageMin > STALE_MIN) {
        top.classList.add("old");
        stamp.textContent += " (ข้อมูลเก่า)";
      }
    } else {
      stamp.textContent = "ยังไม่มีข้อมูลราคา";
    }

    $("note").textContent = !prices
      ? "ระบบยังไม่ได้ดึงราคารอบแรก รอสักครู่แล้วกดรีเฟรช"
      : missing.length ? "ไม่พบราคา: " + missing.join(", ") : "";
  }

  function load() {
    $("stamp").textContent = "กำลังโหลด…";
    var pricesReq = getJSON("prices.json").catch(function () { return null; });
    var tickersReq = getJSON("tickers.json");
    Promise.all([tickersReq, pricesReq]).then(function (r) {
      tickersCache = r[0];
      pricesCache = r[1];
      render(r[0], r[1]);
    }).catch(function () {
      $("stamp").textContent = "โหลดรายชื่อหุ้นไม่สำเร็จ";
    });
  }

  $("sort").addEventListener("click", function () {
    sortMode = sortMode === "pct" ? "custom" : "pct";
    try { localStorage.setItem("stock-sort", sortMode); } catch (e) {}
    updateSortBtn();
    if (tickersCache) render(tickersCache, pricesCache);
  });
  updateSortBtn();

  $("pages").addEventListener("scroll", markDots);
  $("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();
  });
  setInterval(function () { if (!document.hidden) load(); }, AUTO_MS);
  load();
})();
</script>
</body>
</html>
